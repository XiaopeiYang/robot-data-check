[project]
name = "robot-data-check"
version = "0.1.0"
description = "Data quality checks for robot learning datasets in the LeRobot format"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=15",
    "huggingface_hub>=0.24",
    "typer>=0.12",
]

[project.optional-dependencies]
viewer = ["fastapi>=0.110", "uvicorn>=0.29"]
video = ["av>=12", "numpy>=1.24"]

[project.scripts]
robocheck = "robot_data_check.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "av>=12",
    "numpy>=1.24",
]
e2e = ["playwright>=1.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_data_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser tests, opt-in via ROBOCHECK_E2E=1 (docs/dev-setup.md)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
